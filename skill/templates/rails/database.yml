default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: "{{PROJECT_NAME}}_development"

test:
  <<: *default
  database: "{{PROJECT_NAME}}_test"

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
